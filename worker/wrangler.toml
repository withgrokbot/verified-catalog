# Reliability lookup Worker (free plan). Deploy: npx wrangler deploy  (after `npx wrangler login`)
name = "verified-catalog-lookup"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true  # keep verified-catalog-lookup.withgrokbot.workers.dev serving exactly as before (0.15.0)
# 402xAgent (formerly Spot-Check), 0.17.0: 402xagent.com is canonical (landing page for browsers + every API route);
# api.402xagent.com = the API. The 0.15.0 hosts stay attached: API/x402/MCP/POST keep answering there; browser page views
# 301 to 402xagent.com (see oldHostPageView in src/lib.js). All zones are in the same account.
routes = [
  { pattern = "402xagent.com", custom_domain = true },
  { pattern = "api.402xagent.com", custom_domain = true },
  { pattern = "payscout.dev", custom_domain = true },
  { pattern = "api.payscout.dev", custom_domain = true },
]
# Ported from the dashboard upload of 2026-10-08 (version b8ef527d): preview URLs + Workers Logs/Traces on.
preview_urls = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
DATA_BASE_URL = "https://withgrokbot.github.io/verified-catalog/"
SELF_CLIENTS = "withgrokbot,withgrokbot-selftest,sam-selftest,discovery-seed"
# UTC date of test day 1 (the 14-day demand test starts 2026-10-01).
WEEK_EPOCH = "2026-10-01"
# CLIENT_SALT is a secret: npx wrangler secret put CLIENT_SALT
# Access (0.3.0): FREE_PER_DAY free /v1/lookup calls per client per UTC day, then an x402 402 for PRICE_ATOMIC
# (USDC, 6 decimals: 20000 = $0.02) on Base mainnet to PAY_TO, verified and settled by FACILITATOR_URL (PayAI,
# public, free tier without an API key). SELF_CLIENTS (client value) are exempt. Payment never changes results.
FREE_PER_DAY = "5"
PRICE_ATOMIC = "20000"
PAY_TO = "0x37cfCC8a29e9ff9458902B29E31E42dc7B718674"
FACILITATOR_URL = "https://facilitator.payai.network"
# agent-tools.cloud ownership proof (descriptor method, https://agent-tools.cloud/docs/claim): per-host public verify tokens,
# served top-level as "agentToolsVerify" in that host's /.well-known/x402 and at /.well-known/agent-tools-verify.txt.
# They re-check daily; keep these in place. Each token appears only on its own host.
AGENT_TOOLS_VERIFY = '{"verified-catalog-lookup.withgrokbot.workers.dev":"atc_oJX_-ffIMuHMZlBzXhs7VRRvItaalGby","api.402xagent.com":"atc_Wsn-DeMuouw4l37sPpLuVW6PC-4LiWoo"}'
# Fallback (NOT active; see FACILITATOR_FALLBACK.md). Config-only, no key, $0 fee per their docs:
#   FACILITATOR_URL = "https://x402.dexter.cash"      # or "https://facilitator.xpay.sh"
# Coinbase CDP (1,000 settlements/month free, then $0.001): apply patches/cdp-facilitator.patch, then
#   FACILITATOR_URL = "https://api.cdp.coinbase.com/platform/v2/x402"  + secrets CDP_API_KEY_ID, CDP_API_KEY_SECRET
# Product (0.5.0): Overnight Chief of Staff Setup Pack — always paid, $9 USDC (9000000 atomic).
# SELF_CLIENTS do NOT get this free. PACK_PREVIEW=1 returns a stub without payment (local tests only).
PACK_PRICE_ATOMIC = "9000000"
# Product (0.6.0): x402 Endpoint Spot-Check — 1 free/client/UTC day, then $0.25 USDC (250000 atomic).
# SELF_CLIENTS exempt from free quota only (still SSRF-gated). Never pays the URL under test.
SPOT_PRICE_ATOMIC = "250000"  # legacy flat price; 0.6.3+ prices per target: 1/10 of its quote, min $0.01, cap $0.25
SPOT_FREE_PER_DAY = "1"
SPOT_PAID_PER_HOUR = "30"

# One data point per lookup (free plan: 100k writes/day, kept 3 months).
[[analytics_engine_datasets]]
binding = "LOOKUPS"
dataset = "vc_lookups"

# Free-quota counter: one SQLite-backed Durable Object per client key (Workers free plan).
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# Pack blobs (PDF guide). Prompts/template live in src/pack/overnight-cos-data.js.
[[kv_namespaces]]
binding = "PACK_BLOBS"
id = "21ac2bd711dd4c01b2cd0ca1a8c14795"

# Public live Spot-Check receipts (0.9.0). Free plan: 5M reads/day, 100k writes/day, 5 GB. Schema: migrations/.
# Weekly crawl receipts (0.11.0): every listed endpoint, sharded c:<id[0:2]> (256 keys) + skip pages s:<n> + meta.
# Written only by receipts/scripts (wrangler kv bulk put, changed keys only; free plan: 1k writes/day, 1 GB).
[[kv_namespaces]]
binding = "CRAWL_KV"
id = "b752270a00ef41e58fbffebe0be5d323"

[[d1_databases]]
binding = "RECEIPTS_DB"
database_name = "vc-spot-receipts"
database_id = "35d1d852-ad3f-471e-9fc6-5b9a9d341e08"
migrations_dir = "migrations"
