# Reliability lookup Worker (free plan). Deploy: npx wrangler deploy  (after `npx wrangler login`)
name = "verified-catalog-lookup"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true  # keep verified-catalog-lookup.withgrokbot.workers.dev serving exactly as before (0.15.0)
# 402xAgent (formerly Spot-Check), 0.17.0: 402xagent.com is canonical (landing page for browsers + every API route);
# api.402xagent.com = the API. The 0.15.0 hosts stay attached: API/x402/MCP/POST keep answering there; browser page views
# 301 to 402xagent.com (see oldHostPageView in src/lib.js). All zones are in the same account.
routes = [
  { pattern = "402xagent.com", custom_domain = true },
  { pattern = "api.402xagent.com", custom_domain = true },
  { pattern = "payscout.dev", custom_domain = true },
  { pattern = "api.payscout.dev", custom_domain = true },
]
# Ported from the dashboard upload of 2026-10-08 (version b8ef527d): preview URLs + Workers Logs/Traces on.
preview_urls = true

# 0.45.2 (Workers Paid): cap CPU per request so a runaway can't bill much. Discovery's cold index load is ~0.3-0.6 s CPU;
# everything else is well under 50 ms. 5,000 ms leaves room for the cold load and stops a runaway.
[limits]
cpu_ms = 5000

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
DATA_BASE_URL = "https://withgrokbot.github.io/verified-catalog/"
SELF_CLIENTS = "withgrokbot,withgrokbot-selftest,sam-selftest,discovery-seed"
# UTC date of test day 1 (the 14-day demand test starts 2026-10-01).
WEEK_EPOCH = "2026-10-01"
# CLIENT_SALT is a secret: npx wrangler secret put CLIENT_SALT
# Access (0.3.0): FREE_PER_DAY free /v1/lookup calls per client per UTC day, then an x402 402 for PRICE_ATOMIC
# (USDC, 6 decimals: 20000 = $0.02) on Base mainnet to PAY_TO, verified and settled by FACILITATOR_URL (PayAI,
# public, free tier without an API key). SELF_CLIENTS (client value) are exempt. Payment never changes results.
FREE_PER_DAY = "5"
PRICE_ATOMIC = "20000"
PAY_TO = "0x37cfCC8a29e9ff9458902B29E31E42dc7B718674"
FACILITATOR_URL = "https://facilitator.payai.network"
# 0.51.0 CDP facilitator (see docs/cdp-0.51.0.md). OFF by default: FACILITATOR_PRIMARY unset/"payai" = PayAI only, unchanged.
# To enable: secrets CDP_API_KEY_ID + CDP_API_KEY_SECRET (wrangler secret put; never in this file), then
#   FACILITATOR_PRIMARY = "cdp"  and optionally  FACILITATOR_CDP_ROUTES = "/v1/products/endpoint-spot-check"  (comma list; empty = all).
# CDP verify 5xx/timeout -> PayAI fallback; CDP 4xx decline -> no fallback; a verified payment is only ever settled on CDP.
# Enabled for spot-check ONLY (owner-approved 2026-10-23); other routes stay PayAI-only.
FACILITATOR_PRIMARY = "cdp"
FACILITATOR_CDP_ROUTES = "/v1/products/endpoint-spot-check"
# CDP self-test drill wallet (public address; CDP refuses payer == payTo). Payments from it are labelled self_test.
DRILL_WALLETS = "0xa880153A381Fc8d9AF0933a4c8a69fA32De6Ef22"
# agent-tools.cloud ownership proof (descriptor method, https://agent-tools.cloud/docs/claim): per-host public verify tokens,
# served top-level as "agentToolsVerify" in that host's /.well-known/x402 and at /.well-known/agent-tools-verify.txt.
# They re-check daily; keep these in place. Each token appears only on its own host.
AGENT_TOOLS_VERIFY = '{"verified-catalog-lookup.withgrokbot.workers.dev":"atc_oJX_-ffIMuHMZlBzXhs7VRRvItaalGby","api.402xagent.com":"atc_Wsn-DeMuouw4l37sPpLuVW6PC-4LiWoo"}'
# 402index.io domain claim (https://402index.io/verify): public SHA-256 hash only, served at /.well-known/402index-verify.txt per host.
INDEX402_VERIFY = '{"api.402xagent.com":"41c5d46f1d1727aa4e6100eeb61a390ac044ad7feb93ea9da311151e83b36689"}'
# Fallback (NOT active; see FACILITATOR_FALLBACK.md). Config-only, no key, $0 fee per their docs:
#   FACILITATOR_URL = "https://x402.dexter.cash"      # or "https://facilitator.xpay.sh"
# Coinbase CDP (1,000 settlements/month free, then $0.001): apply patches/cdp-facilitator.patch, then
#   FACILITATOR_URL = "https://api.cdp.coinbase.com/platform/v2/x402"  + secrets CDP_API_KEY_ID, CDP_API_KEY_SECRET
# Product (0.5.0): Overnight Chief of Staff Setup Pack — always paid, $9 USDC (9000000 atomic).
# SELF_CLIENTS do NOT get this free. PACK_PREVIEW=1 returns a stub without payment (local tests only).
PACK_PRICE_ATOMIC = "9000000"
# Product (0.6.0): x402 Endpoint Spot-Check — 5 free/client/UTC day, then $0.02 USDC flat (20000 atomic, 0.38.0).
# SELF_CLIENTS exempt from free quota only (still SSRF-gated). Never pays the URL under test.
SPOT_PRICE_ATOMIC = "20000"  # legacy, unused: 0.38.0+ the paid check is a flat $0.02 (SPOT_PAID_ATOMIC in lib.js)
SPOT_FREE_PER_DAY = "5"
SPOT_FREE_PER_IP_DAY = "25"
# 0.35.0: /saves page (names sellers); approved and on
SAVES_PAGE = "on"
SPOT_PAID_PER_HOUR = "30"
# 0.54.0 terms freshness: catalog/crawl pays (discover, crawl receipts, by-url, skips, lookup) older than this many hours
# are stale (discover answers recheck/terms_stale). 168 h = 7 days (the weekly crawl; same window as before 0.54.0).
# Unset or invalid = 24. llms.txt, OpenAPI, MCP discover and the discover rules text are rendered from this value.
TERMS_MAX_AGE_HOURS = "168"
# 0.55.0 skip-reason tuning: rate_limited (429) / waf_challenge (WAF 403) / dns_error rechecks that persist this many hours
# for the same URL + method fall back to skip (*_persistent). Unset or invalid = 24. The crawl reads the same name.
# TRANSIENT_SKIP_AFTER_HOURS = "24"
# 0.56.0 per-target timeout + per-host circuit breaker (worker/src/breaker.js). Defaults live in code; set only to change them.
# PROBE_TIMEOUT_MS: one budget for the whole probe of a target (redirect hops + body), 1000-30000, else 8000. The crawl reads the same name.
# BREAKER_FAILS failed probes of a host (5xx / timeout / connection error) within BREAKER_WINDOW_MIN open the breaker for
# BREAKER_COOLDOWN_MIN: recheck/host_unstable, target not fetched, no free check used, never charged. BREAKER_FAILS = "0" = off.
# PROBE_TIMEOUT_MS = "8000"
# BREAKER_FAILS = "3"
# BREAKER_WINDOW_MIN = "10"
# BREAKER_COOLDOWN_MIN = "15"
ENDPOINT_REPORT = "1"  # 0.46.1: paid /v1/products/endpoint-report on (migration 0012 applied); Base mainnet (no PAYMENT_* vars)
WATCHTOWER = "1"  # 0.47.0: Watchtower on (migration 0013 applied); Base mainnet preset (no PAYMENT_* vars)
EXPLAIN_LINE = "1"  # 0.49.0: explanation line on (no migration/secret)
RECHECK = "1"  # 0.49.0: re-check window on (migration 0015 applied, secret RECHECK_PEPPER set)
BULK_REPORT = "1"  # 0.49.0: bulk endpoint report on (1-5 URLs, min(n x $0.05, $0.20))
FEED = "observe"  # 0.53.3: feed observe-only (migration 0018 applied): opt-ins + observations recorded, nothing served; FEED = "1" needs a separate OK
DELIVERY_CHECK = "1"  # 0.53.3: post-payment delivery check (migration 0020 applied): a new pay -> recheck/delivery_failed only with a failed delivery row in 14 d
# 0.48.0 ops counters (migration 0014): paywall funnel + 404 path log in D1. OPS_COUNTERS = "off" disables. Optional DRILL_WALLETS
# (comma list of the drill wallet addresses) marks those payers as self traffic, like PAY_TO; unset = only PAY_TO is self.
# 0.49.0 flags, all OFF by default (see docs/deploy-0.49.0.md): EXPLAIN_LINE = "1" (explanation line), RECHECK = "1" (24 h / 10 re-check
# window; needs migration 0015 + secret RECHECK_PEPPER), BULK_REPORT = "1" (bulk endpoint report; needs 0015, ENDPOINT_REPORT and RECHECK for credits).
# Payment network (0.46.0): unset = Base mainnet (prod). Local testnet only: --var PAYMENT_PRESET:base-sepolia --var FACILITATOR_URL:https://x402.org/facilitator
# (eip155:84532, USDC 0x036CbD53842c5426634e7929541eC2318f3dCF7e). Optional overrides: PAYMENT_NETWORK, PAYMENT_ASSET, PAYMENT_ASSET_NAME, PAYMENT_ASSET_VERSION.

# One data point per lookup (free plan: 100k writes/day, kept 3 months).
[[analytics_engine_datasets]]
binding = "LOOKUPS"
dataset = "vc_lookups"

# 0.52.0 spot funnel (free_check / cap_hit / paid), per-day digests only; read at admin GET /v1/admin/funnel
[[analytics_engine_datasets]]
binding = "FUNNEL"
dataset = "vc_funnel"

# Free-quota counter: one SQLite-backed Durable Object per client key (Workers free plan).
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# Pack blobs (PDF guide). Prompts/template live in src/pack/overnight-cos-data.js.
[[kv_namespaces]]
binding = "PACK_BLOBS"
id = "21ac2bd711dd4c01b2cd0ca1a8c14795"

# Public live Spot-Check receipts (0.9.0). Free plan: 5M reads/day, 100k writes/day, 5 GB. Schema: migrations/.
# Weekly crawl receipts (0.11.0): every listed endpoint, sharded c:<id[0:2]> (256 keys) + skip pages s:<n> + meta.
# Written only by receipts/scripts (wrangler kv bulk put, changed keys only; free plan: 1k writes/day, 1 GB).
[[kv_namespaces]]
binding = "CRAWL_KV"
id = "b752270a00ef41e58fbffebe0be5d323"

[[d1_databases]]
binding = "RECEIPTS_DB"
database_name = "vc-spot-receipts"
database_id = "35d1d852-ad3f-471e-9fc6-5b9a9d341e08"
migrations_dir = "migrations"

# 0.26.0: lean /bazaar refresh; idle steps are one KV read
# 0.36.0: "17 10 * * *" = daily re-check of the badge hosts (src/daily.js), 10:17 UTC; D1 only, 0 KV writes
[triggers]
crons = ["*/20 * * * *", "17 10 * * *"]
