# Daily FREE checks (no payments). Not active until this repository is pushed to the brand account.
# 14:17 UTC = 07:17 Pacific during daylight time (06:17 in winter). Off the top of the hour to avoid cron congestion.
name: daily-free-checks
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-free-checks
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Free checks only: no --pay flag and no wallet secret is given to this job.
      - name: Run free checks and rebuild the site
        run: python3 scripts/run_checks.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ catalog.json index.html methodology.html llms.txt services/ .well-known/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily free checks $(date -u +%Y-%m-%d)"
            git push
          fi
