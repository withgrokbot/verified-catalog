# Publish server.json to the official MCP Registry using GitHub Actions OIDC.
# Manual trigger only. No secrets and no payment flags are used in this job.
name: publish-mcp
on:
  workflow_dispatch: {}
permissions:
  id-token: write # Required for MCP Registry OIDC authentication
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher (official release, linux amd64)
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
